<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Sign-up Code</title>
</head>
<body style="margin:0; padding:0; background-color:#ffffff;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#ffffff;">
        <tr>
            <td align="center">
                <table role="presentation" width="500" cellpadding="0" cellspacing="0"
                       style="max-width:500px; width:100%; background-color:#ffffff; font-family:Arial, Helvetica, sans-serif; color:#1a1a1a;">
                    <tr>
                        <td style="padding:0;">
                            <img src="cid:header" alt="GreenScape" width="500"
                                 style="display:block; width:100%; max-width:500px; height:auto; border:0;">
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:24px 32px 8px 32px; font-size:15px; font-weight:bold; color:#1a1a1a;">
                            Hello Farmer!
                        </td>
                    </tr>
                    <tr>
                        <td align="center" style="padding:24px 32px 4px 32px; font-size:15px; color:#1a1a1a;">
                            Your Sign-up Code is:
                        </td>
                    </tr>
                    <tr>
                        <td align="center" style="padding:4px 32px 28px 32px; font-size:38px; font-weight:bold; letter-spacing:4px; color:#111111;">
                            {{code}}
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:8px 32px 4px 32px; font-size:13px; color:#333333;">
                            If you didn't request any Code, just ignore this message. Thank you!
                        </td>
                    </tr>
                    <tr>
                        <td align="right" style="padding:24px 32px 28px 32px; font-size:13px; color:#333333;">
                            Team <span style="color:#2e7d32; font-weight:bold;">GreenScape</span>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
